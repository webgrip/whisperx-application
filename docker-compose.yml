name: whisperx

x-common-volumes: &common_volumes
  - ./data:/app/data
  - ./output:/app/output

x-worker-volumes: &worker_volumes
  - ./cache:/.cache
  - ./data:/app/data
  - ./output:/app/output

x-common-env: &common_env
  HF_HOME: /.cache/huggingface
  HF_HUB_CACHE: /.cache/huggingface/hub
  WHISPERX_MODEL_DIR: /.cache
  PYANNOTE_CACHE: /.cache/pyannote
  TORCH_HOME: /.cache/torch

  # Token for gated Hugging Face repos (e.g. pyannote diarization). We wire this
  # explicitly so it's present even if `env_file` is missing on a VM.
  HF_TOKEN: ${HF_TOKEN-}
  HUGGINGFACE_HUB_TOKEN: ${HF_TOKEN-}

  # Avoid Matplotlib trying to create cache dirs under /.cache (some libs import it transitively).
  MPLCONFIGDIR: /tmp/matplotlib

  # Queue
  REDIS_URL: redis://redis:6379/0
  QUEUE_NAME: whisperx

  # WhisperX CLI model names
  WHISPER_MODEL: large-v2
  # Optional override (otherwise WhisperX auto-picks)
  # ALIGN_MODEL: WAV2VEC2_ASR_LARGE_LV60K_960H
  # Optional diarization pipeline choice
  # DIARIZE_MODEL: pyannote/speaker-diarization-3.1

  # IO layout
  OUTDIR: /app/output
  UPLOADS_DIR: /app/data/uploads
  JOBS_DIR: /app/output/jobs

volumes:
  redis_data:

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  whisperx-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes: *common_volumes
    env_file:
      - .env
    environment:
      <<: *common_env
      # API is lightweight; keep it CPU-only.
      DEVICE: cpu
      COMPUTE_TYPE: auto
    command:
      - gunicorn
      - -k
      - uvicorn.workers.UvicornWorker
      - -w
      - "2"
      - -b
      - 0.0.0.0:8000
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - --timeout
      - "300"
      - offline_whisperx.api.main:app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  whisperx-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    deploy: {}
    gpus:
      - device: "all"
    volumes: *worker_volumes
    env_file:
      - .env
    environment:
      <<: *common_env
      DEVICE: cuda
      COMPUTE_TYPE: float16
    # IMPORTANT: escape with $$ so Compose does not interpolate.
    command: ["sh", "-lc", 'rq worker -u "$$REDIS_URL" "$$QUEUE_NAME"']

  whisperx-cli:
    build:
      context: .
      dockerfile: Dockerfile.worker
    profiles: ["cli"]
    restart: "no"
    deploy: {}
    gpus:
      - device: "all"
    volumes: *worker_volumes
    env_file:
      - .env
    environment:
      <<: *common_env
      DEVICE: cuda
      COMPUTE_TYPE: float16
    entrypoint: ["whisperx"]
    command: ["--help"]
